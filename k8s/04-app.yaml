apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-metrics-demo
  namespace: dt-demo
  labels:
    app: dt-metrics-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dt-metrics-demo
  template:
    metadata:
      labels:
        app: dt-metrics-demo
    spec:
      containers:
        - name: dt-metrics-demo
          image: dt-metrics-demo:latest
          imagePullPolicy: IfNotPresent

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.dt-demo.svc.cluster.local:4318"

            - name: SYSLOG_HOST
              value: "dt-log-ingest.dt-demo.svc.cluster.local"
            - name: SYSLOG_PORT
              value: "1514"

            - name: HTTP_PORT
              value: "8080"
            - name: METRICS_INTERVAL_S
              value: "1"
            - name: APP_NAME
              value: "dt-metrics-demo"
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
---
apiVersion: v1
kind: Service
metadata:
  name: dt-metrics-demo
  namespace: dt-demo
spec:
  selector:
    app: dt-metrics-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
